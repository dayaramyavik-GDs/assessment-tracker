<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;
                 connect-src 'self' http://localhost:3000 https://assessment-tracker-api.onrender.com;
                 base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
  <title>Assessment Tracker</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="offline-banner" class="banner" role="status" hidden>You're offline. Changes can't be saved right now.</div>
  <main id="view" aria-live="polite"></main>

  <nav id="tabbar" class="tabbar" hidden>
    <button type="button" data-tab="home">Home</button>
    <button type="button" data-tab="units">Units</button>
    <button type="button" data-tab="calendar">Calendar</button>
    <button type="button" data-tab="timer">Timer</button>
    <button type="button" data-tab="atRisk">At Risk</button>
  </nav>
  <div id="toasts" aria-live="assertive"></div>

  <script src="cordova.js"></script>
  <script src="lib/jquery.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/grades.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
  <script src="js/api.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/screens/auth.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/units.js"></script>
  <script src="js/screens/assessmentForm.js"></script>
  <script src="js/screens/calendar.js"></script>
  <script src="js/screens/timer.js"></script>
  <script src="js/screens/atRisk.js"></script>
  <script src="js/screens/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
